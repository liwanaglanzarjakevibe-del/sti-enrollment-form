<!DOCTYPE html>

<html>

	<head>
		
		<title> STI Enrollment Form </title>
		
		<style>

			body {
				font-family: Arial, sans-serif;
				background-color: #FFFF8F;
			}

			h1, h4 {
				text-align: center;
			}

			table {
				width: 100%;
				border-collapse: collapse;
				margin-bottom: 15px;
				background-color: #F0FFFF;
			}

			th {
				text-align: left;
				padding: 10px;
				border: 1px solid black;
			}

			.unbold {
				font-weight: normal;
			}


			input[type="text"], input[type="date"] {
    				width: 100%;
	 			box-sizing: border-box;
    				padding: 10px;
    				margin-top: 5px;
    				display: block;
    				border: 1px solid #899499;
    				border-radius: 4px;
				background-color: #FAF9F6;
			}

			input[type = "reset"] {
				background-color: white;
				border-color: #0047AB;
				color: #0047AB;
				padding: 10px 20px;
				border-radius: 5px;
				font-size: 16px;
				margin-right: 15px;
			}

			input[type = "submit"] {
				background-color: #0047AB;
				border: none;
				color: white;
				padding: 10px 20px;
				border-radius: 5px;
				font-size: 16px;
			}


			.button_container {
				text-align: center;
				margin-top: 20px;
			}

		</style>
	</head>

	<body>
		
		<h1> STI COLLEGE SAN JOSE DEL MONTE </h1>

		<h4> FILL OUT ALL DETAILS COMPLETELY </h4>

		<form>
			<table>

			<tr>

				<th>	
					
					<label for = "academic_year"> Academic Year: </label> 
					<input type = "text" id = "academic_year" name = "academic_year"> <br>

				</th>

				<th>

					<label for = "Term"> Term: </label> 
					<input type = "text" id = "term" name = "term"> <br>

				</th>

				<th>

					<label for = "Year Level"> Year Level: </label> 
					<input type = "text" id = "year_level" name = "year_level"> <br>

				</th>

			</tr>
			
		</table> <br>

		<table>

			<tr>

				<th>

					<label for = "Program"> Program: </label> 
					<input type = "text" id = "program" name = "program"> <br>

				</th>

				<th>

					<label for = "Last Name"> Last Name: </label> 
					<input type = "text" id = "last_name" name = "last_name"> <br>

				</th>

				<th>

					<label for = "First Name"> First Name: </label> 
					<input type = "text" id = "first_name" name = "first_name"> <br>

				</th>

				<th>

					<label for = "Middle Name"> Middle Name: </label> 
					<input type = "text" id = "middle_name" name = "middle_name"> <br>

				</th>

			</tr>

		</table> <br>

		<table>

			<tr>
				
				<th>
					
					<p> Gender: </P>
					
					<p class = "unbold">
					<input type = "radio" id = "male" name = "gender" value = "Male">
 					<label for = "male"> Male </label> 

					<input type = "radio" id = "female" name = "gender" value = "Female">
 					<label for = "female"> Female </label> 
					</p>

				</th> 

				<th>
	
					<p> Birthday: </p>
			
					<input type = "date">

				</th>

				<th>

					<label for = "Email Address"> Email Address: </label> 
					<input type = "text" id = "email_address" name = "email_address"> <br>

				</th>

			</tr>

		</table> <br>

		<table>

			<tr>

				<th>

					<label for = "Permanent Address"> Permanent Address: </label> 
					<input type = "text" id = "permanent_address" name = "permanent_address"> <br>

				</th>

			</tr>

		</table> <br>

		<table>

			<tr>

				<th>

					<label for = "Current Address"> Current Address: </label> 
					<input type = "text" id = "current_address" name = "current_address"> <br>

				</th>

			</tr>

		</table> <br>

		<table>

			<tr>

				<th>
					
					<label for = "Telephone No."> Telephone No.: </label> 
					<input type = "text" id = "telephone_no" name = "telephone_no"> <br>

				</th>

				<th>

					<label for = "Contact No."> Contact No.: </label> 
					<input type = "text" id = "contact_no" name = "contact_no"> <br>

				</th>

				<th>

					<label for = "Student Classification"> Student Classification (For Old Students): </label> 
					<input type = "text" id = "student_classification" name = "student_classification"> <br>

				</th>

			</tr>

		</table> <br>

		<table>

			<tr>

				<th>

					<p> Student Type: </p>

					<p class = "unbold">
					<input type = "radio" id = "regular" name = "student_type" value = "Regular">
 					<label for = "regular"> Regular </label> 

					<input type = "radio" id = "irregular" name = "student_type" value = "Irregular">
 					<label for = "irregular"> Irregular </label>
					</p>

				</th>

				<th>

					<p> Payment Scheme: </p>

					<p class = "unbold">
					<input type = "radio" id = "cash" name = "payment_scheme" value = "Cash">
 					<label for = "cash"> Cash </label> 

					<input type = "radio" id = "low_down" name = "payment_scheme" value = "Low Down Payment">
 					<label for = "low_down"> Low Down Payment </label>

					<input type = "radio" id = "low_monthly" name = "payment_scheme" value = "Low Monthly Payment">
 					<label for = "low_monthly"> Low Monthly Payment </label>
					</p>

				</th>

			</tr>

		</table> <br>

		<div class = "button_container">	
			
			<input type = "reset" value = "Reset"> 
			<input type = "submit" value = "Submit">

		</div>

		</form>	
	</body>

</html>
